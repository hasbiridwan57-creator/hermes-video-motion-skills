<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Galeri · Paket Template Motion</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0D1533;color:#FFF3D6;font:600 16px/1.5 "Nunito","Segoe UI",system-ui,sans-serif;padding:clamp(20px,4vw,48px)}
h1{font:700 clamp(28px,4vw,44px)/1.1 "Fredoka",system-ui,sans-serif;letter-spacing:-.01em}
h1 em{font-style:normal;color:#FFD45C}
.lead{max-width:46em;margin:12px 0 28px;opacity:.82}
.lead code,.kt code{font:600 .92em ui-monospace,Menlo,monospace;background:rgba(255,243,214,.1);padding:.1em .4em;border-radius:6px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,360px),1fr));gap:22px}
.kartu{background:#141E42;border-radius:20px;overflow:hidden;box-shadow:inset 0 0 0 1px rgba(255,243,214,.12)}
.vw{position:relative;height:0;padding-top:56.25%;background:#05070F}
.fr{position:absolute;left:0;top:0;width:100%;height:100%;border:0;display:block}
.fr.p{left:34.18%;width:31.64%}
.isi{padding:16px 18px 18px;display:grid;gap:8px}
.jd{display:flex;align-items:baseline;gap:10px;font:700 20px/1.2 "Fredoka",system-ui,sans-serif}
.jd small{font:700 12px/1 ui-monospace,Menlo,monospace;color:#FFD45C;letter-spacing:.06em}
.kt{font-size:14.5px;opacity:.8}
.baris{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
button,.baris a{font:700 13px/1 "Fredoka",system-ui,sans-serif;color:#FFF3D6;background:rgba(255,243,214,.1);border:0;border-radius:999px;padding:9px 14px;cursor:pointer;text-decoration:none}
button.on{background:#FFD45C;color:#1B2346}
button:hover,.baris a:hover{background:rgba(255,243,214,.2)}button.on:hover{background:#FFD45C}
button:focus-visible,.baris a:focus-visible{outline:3px solid #8FE3C8;outline-offset:2px}
</style>
</head>
<body>
<h1>Paket <em>Template Motion</em></h1>
<p class="lead">12 template siap pakai. Tekan <b>16:9</b> atau <b>9:16</b> untuk melihat dua ukurannya, <b>Buka</b> untuk memutar penuh dengan suara. Untuk memakainya, bilang ke Claude: <code>pakai template logo reveal dari Paket Template Motion</code>, lalu sebutkan teks, logo, dan warnamu.</p>
<div class="grid" id="grid"></div>
<script>
const T = [
  ['01-logo-reveal', 'Logo reveal', 'l', 'Logo atau nama brand muncul dengan gerak. ±5 detik.'],
  ['02-intro-kanal', 'Intro kanal', 'l', 'Kata-kata melesat bergantian, lalu nama kanal. ±6 detik.'],
  ['03-judul-bab', 'Judul bab', 'l', 'Kartu pembuka tiap bagian video. 4 detik.'],
  ['04-lower-third', 'Lower third', 'l', 'Papan nama di bawah layar. Bisa di atas videomu.'],
  ['05-subscribe', 'Subscribe', 'l', 'Tombol ditekan, lonceng berbunyi. Bisa di atas videomu.'],
  ['06-hook-reels', 'Hook Reels', 'p', 'Pembuka 3 detik pertama. 4 detik.'],
  ['07-daftar-poin', 'Daftar poin', 'l', 'Judul + 2 sampai 5 poin bernomor.'],
  ['08-quote', 'Quote', 'p', 'Kutipan kata demi kata dengan stabilo.'],
  ['09-promo', 'Promo', 'l', 'Flash sale dengan stempel diskon. 5 detik.'],
  ['10-cta-follow', 'Ajakan follow', 'p', 'Penutup Reels: foto profil + tombol Follow.'],
  ['11-end-screen', 'End screen', 'l', 'Layar akhir YouTube: dua bingkai video + subscribe.'],
  ['12-transisi', 'Transisi', 'l', 'Tiga pita warna menyapu, adegan berganti.']
];
const grid = document.getElementById('grid');
const src = (f, r) => f + '.html?senyap=1&rasio=' + (r === 'p' ? '9:16' : '16:9');
grid.innerHTML = T.map(([f, n, r, k]) => `<article class="kartu" data-f="${f}">
  <div class="vw"><iframe class="fr${r === 'p' ? ' p' : ''}" loading="lazy" title="${n}" src="${src(f, r)}"></iframe></div>
  <div class="isi"><div class="jd"><small>${f.slice(0, 2)}</small>${n}</div><div class="kt">${k}<br><code>${f}.html</code></div>
  <div class="baris"><button data-r="l"${r === 'l' ? ' class="on"' : ''}>16:9</button><button data-r="p"${r === 'p' ? ' class="on"' : ''}>9:16</button><a href="${f}.html" target="_blank" rel="noopener">Buka</a></div></div></article>`).join('');
grid.addEventListener('click', e => {
  const b = e.target.closest('button[data-r]'); if (!b) return;
  const k = b.closest('.kartu'), fr = k.querySelector('iframe'), r = b.dataset.r;
  k.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));
  fr.classList.toggle('p', r === 'p'); fr.src = src(k.dataset.f, r);
});
</script>
</body>
</html>
