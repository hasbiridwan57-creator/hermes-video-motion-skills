<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>08 · Quote · Paket Template Motion</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<script>
/* ================= UBAH DI SINI =================
   Quote: kutipan yang muncul kata demi kata, bagian penting diberi stabilo. ±6 detik (mengikuti panjang kutipan). */
const CONFIG = {
  rasio: '9:16',                 // '9:16' (Reels, TikTok, Shorts) atau '16:9' (YouTube)
  kutipan: 'Konsisten itu *lebih penting* daripada sempurna.',   // *kata* = diberi stabilo
  oleh: 'Nama Kamu',             // siapa yang bilang (kosongkan '' bila tidak mau)
  peran: '@akunmu',              // baris kecil di bawah nama (kosongkan '' bila tidak mau)
  tahan: 3,                      // berapa detik kutipan diam setelah lengkap
  keluar: true,                  // true = menghilang di akhir, false = berhenti di layar
  suara: true,                   // false = tanpa efek suara
  latar: 'bawaan',               // 'bawaan' | '#141E42' | 'assets/img/foto.jpg' | 'assets/klip.mp4'
  warna: { latar: '#141E42', teks: '#FFF3D6', aksen: '#FFD45C', aksen2: '#FF6B57', aksen3: '#8FE3C8', tinta: '#1B2346' },
  font: { judul: 'Fredoka', isi: 'Nunito' }   // ganti font: ubah juga tautan Google Fonts di atas
};
</script>
<style>
/* ===== Kit Paket Template Motion: dasar panggung (jangan diubah, ubah CONFIG di atas) ===== */
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#05070F}
/* panggung dipatok ke ukuran video (1920x1080 atau 1080x1920) lalu diskalakan ke jendela.
   1u = 1% sisi pendek (10,8 px), jadi ukuran elemen sama di 16:9 dan 9:16 */
#stage{position:fixed;left:50%;top:50%;width:var(--W);height:var(--H);overflow:hidden;--u:calc(var(--S) / 100);
  background:var(--bg);color:var(--fg);font-family:var(--f-isi);font-weight:700;line-height:1.12;font-size:calc(var(--u) * 4);
  -webkit-font-smoothing:antialiased;text-rendering:geometricPrecision}
#stage em{font-style:normal}
.jd{font-family:var(--f-judul);font-weight:700;letter-spacing:-.01em;line-height:1}
.k,.h{display:inline-block}
.media{overflow:hidden}
.media>img,.media>video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.mft-latar{position:absolute;inset:0}
.polos .dekor{display:none!important}
.pakai-logo>img{width:100%;height:100%;object-fit:contain;display:block}
/* panel periksa (?debug=1): geser waktu seperti timeline */
#mft-ui{position:fixed;left:16px;right:16px;bottom:14px;z-index:99;display:none;align-items:center;gap:12px;padding:10px 14px;border-radius:12px;
  background:rgba(8,12,30,.82);color:#FFF3D6;font:600 13px/1 ui-monospace,Menlo,monospace}
#mft-ui.on{display:flex}
#mft-ui input{flex:1;accent-color:#FFD45C}

.bg{position:absolute;inset:0;background:linear-gradient(170deg,var(--bg2),var(--bg) 45%,var(--bg3))}
.lgk{position:absolute;border-radius:50%;border:calc(var(--u)*.5) solid var(--fg);opacity:.08}
.lgk.l1{width:calc(var(--u)*70);height:calc(var(--u)*70);right:-24%;top:-8%}
.lgk.l2{width:calc(var(--u)*44);height:calc(var(--u)*44);left:-16%;bottom:-6%}
.blok{position:absolute;left:10%;right:10%;top:50%;display:grid;justify-items:start;gap:calc(var(--u)*3.6)}
.tk{font:700 calc(var(--u)*34)/.62 Georgia,"Times New Roman",serif;color:var(--a1);height:calc(var(--u)*13)}
.kt{font-size:calc(var(--u)*10.4);line-height:1.16}
.kt em{position:relative;z-index:0;padding:0 .12em;margin:0 -.04em;border-radius:.14em;
  background:linear-gradient(var(--a1),var(--a1)) 0 60%/0% 78% no-repeat;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.grs{width:calc(var(--u)*12);height:calc(var(--u)*1);border-radius:1em;background:var(--a2)}
.oleh{display:grid;gap:calc(var(--u)*.8)}
.nm{font-size:calc(var(--u)*4.8);font-weight:800}
.pr{font-size:calc(var(--u)*3.8);opacity:.7}
.polos .kt,.polos .nm,.polos .pr{text-shadow:0 .06em .5em rgba(0,0,0,.55)}
.land .blok{left:12%;right:14%;gap:calc(var(--u)*3)}
.land .kt{font-size:calc(var(--u)*8.4)}
.land .tk{font-size:calc(var(--u)*30);height:calc(var(--u)*11)}
.land .lgk.l1{right:-8%;top:-40%}.land .lgk.l2{left:-6%;bottom:-36%}
</style>
</head>
<body>
<div id="stage">
  <div class="bg dekor"></div>
  <i class="lgk l1 dekor"></i><i class="lgk l2 dekor"></i>
  <div class="blok">
    <div class="tk">“</div>
    <div class="kt jd"></div>
    <i class="grs"></i>
    <div class="oleh"><div class="nm"></div><div class="pr"></div></div>
  </div>
</div>
<script>
/* ===== Kit Paket Template Motion (jangan diubah, ubah CONFIG di atas) =====
   Mengurus: rasio 16:9 / 9:16, warna & font dari CONFIG, latar (bawaan / hijau / warna / gambar / video),
   logo, teks yang menyesuaikan lebar, efek suara, putar otomatis + ulang, dan window.OPENER untuk
   scripts/render_mp4.py. Semua gerak ada di SATU timeline GSAP, jadi hasil render selalu sama. */
var MFT = (function () {
  var Q = new URLSearchParams(location.search), C = typeof CONFIG !== 'undefined' ? CONFIG : {};
  var rasio = String(Q.get('rasio') || C.rasio || '16:9').replace(/[x×]/, ':').trim();
  var port = rasio === '9:16';
  var W = port ? 1080 : 1920, H = port ? 1920 : 1080, S = Math.min(W, H);
  var root = document.documentElement, stage = document.getElementById('stage');
  var w = Object.assign({ latar: '#141E42', teks: '#FFF3D6', aksen: '#FFD45C', aksen2: '#FF6B57', aksen3: '#8FE3C8', tinta: '#1B2346' }, C.warna || {});
  var f = Object.assign({ judul: 'Fredoka', isi: 'Nunito' }, C.font || {});
  var css = {
    '--W': W + 'px', '--H': H + 'px', '--S': S + 'px',
    '--lg-bg': C.latarLogo || w.teks, '--bg': w.latar, '--fg': w.teks, '--a1': w.aksen, '--a2': w.aksen2, '--a3': w.aksen3, '--ink': w.tinta,
    '--bg2': w.latarTerang || 'color-mix(in srgb, ' + w.latar + ' 80%, #6F86E8)',
    '--bg3': w.latarGelap || 'color-mix(in srgb, ' + w.latar + ' 72%, #000)',
    '--f-judul': '"' + f.judul + '", "Baloo 2", system-ui, sans-serif',
    '--f-isi': '"' + f.isi + '", "Segoe UI", system-ui, sans-serif'
  };
  Object.keys(css).forEach(function (k) { root.style.setProperty(k, css[k]); });
  stage.classList.add(port ? 'port' : 'land');
  window.OPENER = { ready: false, W: W, H: H };

  var noop = function () {};
  function u(n) { return n * S / 100; }
  function $(s, r) { return (r || stage).querySelector(s); }
  function $$(s, r) { return Array.prototype.slice.call((r || stage).querySelectorAll(s)); }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  /* teks dari CONFIG: *kata* = disorot, baris baru = ganti baris */
  function kaya(s) { return esc(s).replace(/\*([^*]+)\*/g, '<em>$1</em>').replace(/\n/g, '<br>'); }
  function teks(sel, str) { var el = typeof sel === 'string' ? $(sel) : sel; if (el) el.innerHTML = kaya(str); return el; }
  /* pecah teks jadi span per 'kata' atau per 'huruf' (kata tetap utuh saat ganti baris) */
  function pecah(el, mode) {
    var out = []; if (!el) return out;
    (function jalan(node) {
      Array.prototype.slice.call(node.childNodes).forEach(function (n) {
        if (n.nodeType === 1) { if (n.tagName !== 'BR') jalan(n); return; }
        if (n.nodeType !== 3) return;
        var frag = document.createDocumentFragment();
        n.textContent.split(/(\s+)/).forEach(function (p) {
          if (!p) return;
          if (/^\s+$/.test(p)) { frag.appendChild(document.createTextNode(' ')); return; }
          var k = document.createElement('span'); k.className = 'k';
          if (mode === 'huruf') Array.from(p).forEach(function (ch) { var h = document.createElement('span'); h.className = 'h'; h.textContent = ch; k.appendChild(h); out.push(h); });
          else { k.textContent = p; out.push(k); }
          frag.appendChild(k);
        });
        node.replaceChild(frag, n);
      });
    })(el);
    return out;
  }
  /* kecilkan huruf sampai teks muat di lebar/tinggi yang diberi (px panggung), tidak lebih kecil dari `min`. Panggil SEBELUM pecah(). */
  function muat(el, maxW, maxH, min) {
    if (!el) return; var fs = parseFloat(getComputedStyle(el).fontSize), n = 0;
    while (n++ < 48 && fs * .96 >= (min || 0) && ((maxW && el.scrollWidth > maxW + 1) || (maxH && el.scrollHeight > maxH + 1))) { fs *= .96; el.style.fontSize = fs + 'px'; }
  }
  /* logo: bila CONFIG.logo diisi, el berisi gambar logo. Mengembalikan true bila gambar dipakai. */
  function logo(el) { if (!el || !C.logo) return false; el.innerHTML = '<img src="' + esc(C.logo) + '" alt="">'; el.classList.add('pakai-logo'); IMG.push(el.firstChild); return true; }
  /* gambar atau video sebagai isi el (memenuhi kotak). Video mengikuti jam timeline, termasuk saat render. */
  var VID = [], IMG = [];
  function media(el, src, o) {
    if (!el || !src) return null; o = o || {}; el.classList.add('media');
    if (/\.(mp4|webm|mov|m4v)(\?|#|$)/i.test(src)) {
      var v = document.createElement('video'); v.src = src; v.muted = true; v.playsInline = true; v.preload = 'auto'; el.appendChild(v);
      VID.push({ el: v, mulai: o.mulai || 0, dari: o.dari || 0, ulang: !!o.ulang }); return v;
    }
    var i = new Image(); i.src = src; i.alt = ''; el.appendChild(i); IMG.push(i); return i;
  }
  /* posisi elemen di panggung (px panggung): {x, y, w, h, cx, cy}. Ukur SEBELUM membuat tween. */
  function kotak(el) { var r = el.getBoundingClientRect(), s = stage.getBoundingClientRect(), z = s.width / W;
    var o = { x: (r.left - s.left) / z, y: (r.top - s.top) / z, w: r.width / z, h: r.height / z }; o.cx = o.x + o.w / 2; o.cy = o.y + o.h / 2; return o; }
  function waktuVid(c, t) { var d = c.el.duration, vt = c.dari + Math.max(0, t - c.mulai); if (!d || !isFinite(d)) return vt; return c.ulang ? vt % d : Math.min(vt, d - .04); }

  /* latar: 'bawaan' | 'hijau' (untuk dibuang di aplikasi edit) | '#warna' | 'assets/foto.jpg' | 'assets/klip.mp4' */
  var L = String(Q.get('latar') || (C.latar == null ? 'bawaan' : C.latar));
  if (L && L !== 'bawaan') {
    stage.classList.add('polos');
    if (L === 'hijau') stage.style.background = '#00FF00';
    else if (/^(#|rgb|hsl)/i.test(L)) stage.style.background = L;
    else { var d = document.createElement('div'); d.className = 'mft-latar'; stage.insertBefore(d, stage.firstChild); media(d, L, { ulang: true }); }
  }

  function paskan() { var s = Math.min(innerWidth / W, innerHeight / H); stage.style.transform = 'translate(-50%,-50%) scale(' + s + ')'; }
  addEventListener('resize', paskan); paskan();

  function start(o) {
    var tl = gsap.timeline({ paused: true });
    var plan = window.AUDIO_PLAN = { vo: [], sfx: [], music: null };
    var k = {
      W: W, H: H, port: port, u: u, $: $, $$: $$, teks: teks, pecah: pecah, muat: muat, logo: logo, media: media, kotak: kotak, warna: w, stage: stage, polos: stage.classList.contains('polos'),
      /* efek suara bawaan paket (folder sfx/): pop, klik, ding, whoosh, swipe, riser, impact, kilau. CONFIG.suara:false = senyap */
      sfx: function (nama, at, vol) { if (C.suara === false || Q.has('senyap')) return; plan.sfx.push({ at: Math.max(0, at), src: 'sfx/' + nama + '.mp3', vol: vol == null ? .5 : vol }); }
    };
    function jalan() {
      o.build(tl, C, k);
      var D = Math.max(tl.duration(), +(o.durasi || 0));
      tl.to({}, { duration: .001 }, D - .001);
      var seek = function (t) { tl.pause(); tl.time(Math.min(t, D), false); if (gsap.ticker.tick) gsap.ticker.tick(); };
      var O = window.OPENER; O.tl = tl; O.DURATION = D; O.seek = seek;
      O.clipsReady = function () { return VID.every(function (c) { return c.el.readyState >= 2; }); };
      O.seekFrame = function (t) {
        seek(t);
        return Promise.all(VID.map(function (c) { return new Promise(function (res) {
          var v = c.el, vt = waktuVid(c, t); if (Math.abs(v.currentTime - vt) < .001) return res();
          var to = setTimeout(res, 1500); v.addEventListener('seeked', function h() { v.removeEventListener('seeked', h); clearTimeout(to); res(); }); v.currentTime = vt;
        }); }));
      };
      /* video latar/klip: ikut timeline saat diputar di browser */
      gsap.ticker.add(function () {
        if (!VID.length) return; var t = tl.time(), main = !tl.paused();
        VID.forEach(function (c) { var v = c.el, vt = waktuVid(c, t);
          if (main && t >= c.mulai) { if (Math.abs(v.currentTime - vt) > .3) v.currentTime = vt; if (v.paused) v.play().catch(noop); }
          else { if (!v.paused) v.pause(); if (Math.abs(v.currentTime - vt) > .04) v.currentTime = vt; } });
      });
      /* suara terikat timeline (sama dengan starter Motion Format): ikut jeda, ulang, dan dibaca render_mp4.py */
      var MF = (function () {
        var on = false, last = 0;
        function mk(s, music) { var a = new Audio(s.src); a.preload = 'auto'; a.volume = s.vol == null ? (music ? .15 : 1) : s.vol; return { at: s.at || 0, el: a, music: !!music }; }
        var LONG = (plan.vo || []).map(function (s) { return mk(s); }).concat(plan.music ? [mk(plan.music, true)] : []);
        var SFX = (plan.sfx || []).map(function (s) { return mk(s); }), ALL = LONG.concat(SFX);
        function unlock() { on = true; }
        addEventListener('pointerdown', unlock, { once: true }); addEventListener('keydown', unlock, { once: true });
        gsap.ticker.add(function () {
          var t = tl.time(), playing = !tl.paused();
          if (!on) { last = t; return; }
          for (var i = 0; i < LONG.length; i++) { var c = LONG[i], dd = c.el.duration, rel = t - c.at;
            var inside = rel >= 0 && (c.music || !dd || !isFinite(dd) || rel < dd);
            if (playing && inside) { var want = c.music && dd && isFinite(dd) ? rel % dd : rel;
              if (Math.abs(c.el.currentTime - want) > .25) c.el.currentTime = want;
              if (c.el.paused) c.el.play().catch(noop); }
            else if (!c.el.paused) c.el.pause(); }
          if (playing) { if (t < last) last = -.001;
            if (t - last < .5) for (var j = 0; j < SFX.length; j++) { var s = SFX[j]; if (s.at > last && s.at <= t) { s.el.currentTime = 0; s.el.play().catch(noop); } } }
          last = t;
        });
        return { has: ALL.length > 0, probe: function () { var a = ALL[0].el, v = a.volume; a.volume = 0;
          return a.play().then(function () { a.pause(); a.currentTime = 0; a.volume = v; on = true; }, function (e) { a.volume = v; throw e; }); } };
      })();
      /* kontrol tersembunyi: Spasi jeda, R ulang. ?debug=1 = panel geser waktu */
      var ui = document.createElement('div'); ui.id = 'mft-ui'; ui.innerHTML = '<span></span><input type="range" min="0" max="1000" value="0">'; document.body.appendChild(ui);
      var jam = ui.firstChild, geser = ui.lastChild, pegang = false;
      if (Q.has('debug')) ui.classList.add('on');
      gsap.ticker.add(function () { if (!ui.classList.contains('on')) return; var t = tl.time(); jam.textContent = t.toFixed(2) + ' / ' + D.toFixed(1) + ' dtk'; if (!pegang) geser.value = String(t / D * 1000); });
      geser.addEventListener('pointerdown', function () { pegang = true; tl.pause(); }); addEventListener('pointerup', function () { pegang = false; });
      geser.addEventListener('input', function () { tl.pause(); tl.time(geser.value / 1000 * D); });
      addEventListener('keydown', function (e) {
        if (e.code === 'Space') { e.preventDefault(); if (tl.paused() || tl.progress() >= 1) { if (tl.progress() >= 1) tl.progress(0); tl.play(); } else tl.pause(); }
        if (/^[rR]$/.test(e.key)) { tl.pause(0); tl.play(); }
      });
      tl.eventCallback('onComplete', function () { tl.play(0); });
      seek(0); O.ready = true;
      if (Q.has('clean')) return;                                   // render: tidak putar otomatis
      if (Q.has('t')) { seek(+Q.get('t') || 0); return; }           // ?t=2.5 = berhenti di detik itu (cek tampilan)
      if (!MF.has) { tl.play(0); return; }
      MF.probe().then(function () { tl.play(0); }).catch(function () {
        tl.pause(0); var go = function () { removeEventListener('pointerdown', go); removeEventListener('keydown', go); tl.play(0); };
        addEventListener('pointerdown', go); addEventListener('keydown', go); });
    }
    /* tunggu font dan gambar dulu, supaya ukuran teks yang diukur sudah benar */
    var tunggu = [document.fonts.load('700 40px "' + f.judul + '"'), document.fonts.load('700 40px "' + f.isi + '"'), document.fonts.load('800 40px "' + f.isi + '"')];
    var batas = new Promise(function (r) { setTimeout(r, 5000); });
    Promise.race([Promise.all(tunggu).then(function () { return document.fonts.ready; }), batas]).then(function () {
      o.siap && o.siap(C, k);                                        // tempat template memasang gambar/logo sebelum diukur
      return Promise.race([Promise.all(IMG.map(function (i) { return i.decode ? i.decode().catch(noop) : null; })), new Promise(function (r) { setTimeout(r, 4000); })]);
    }).then(jalan, function (e) { console.error(e); jalan(); }).catch(function (e) { window.MFT_GALAT = String(e && e.stack || e); console.error(e); });
  }
  return { start: start, W: W, H: H, port: port };
})();

</script>
<script>
MFT.start({
  siap(c, k) {
    k.teks('.kt', c.kutipan); k.teks('.nm', c.oleh); k.teks('.pr', c.peran);
    if (!c.oleh) k.$('.nm').style.display = 'none';
    if (!c.peran) k.$('.pr').style.display = 'none';
    if (!c.oleh && !c.peran) { k.$('.grs').style.display = 'none'; k.$('.oleh').style.display = 'none'; }
  },
  build(tl, c, k) {
    gsap.set('.blok', { yPercent: -50 });
    k.muat(k.$('.kt'), 0, k.H * (k.port ? .46 : .44));
    const kata = k.pecah(k.$('.kt'), 'kata'), em = k.$$('.kt em'), tahan = Math.max(1, +c.tahan || 3);
    const tKata = .42, lama = kata.length * .055;
    tl.from('.tk', { scale: 0, rotation: -25, duration: .55, ease: 'back.out(2.4)', transformOrigin: '20% 60%' }, .12)
      .from(kata, { y: '.55em', opacity: 0, duration: .5, ease: 'power3.out', stagger: .055 }, tKata);
    // stabilo digambar setelah semua kata tampil, warna huruf ikut berubah jadi warna tinta
    const tS = tKata + lama + .3;
    em.forEach((e, i) => {
      tl.to(e, { backgroundSize: '100% 78%', duration: .42, ease: 'power3.out' }, tS + i * .22)
        .fromTo(e, { color: k.warna.teks }, { color: k.warna.tinta, duration: .22, ease: 'none' }, tS + i * .22 + .06);
      k.sfx('swipe', tS + i * .22, .28);
    });
    const tO = tS + em.length * .22 + .2;
    tl.from('.grs', { scaleX: 0, transformOrigin: '0 50%', duration: .45, ease: 'power3.out' }, tO)
      .from(['.nm', '.pr'], { x: k.u(-3), opacity: 0, duration: .45, ease: 'power3.out', stagger: .08 }, tO + .12);
    k.sfx('pop', .12, .42); k.sfx('ding', tO + .1, .32);
    const tK = tO + .6 + tahan;
    if (c.keluar !== false) {
      tl.to('.blok', { y: k.u(-3), opacity: 0, duration: .45, ease: 'power2.in' }, tK);
      k.sfx('swipe', tK, .26);
    }
    tl.fromTo('.lgk', { scale: 1 }, { scale: 1.12, duration: tK + .7, ease: 'none' }, 0);
  }
});
</script>
</body>
</html>
